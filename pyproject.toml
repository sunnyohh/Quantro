[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantro"
version = "0.1.0"
description = "Isolated investment budgets and deterministic trading core"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
database = ["sqlalchemy>=2.0,<2.1", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
