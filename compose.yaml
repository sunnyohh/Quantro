services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: quantro
      POSTGRES_USER: quantro
      POSTGRES_PASSWORD: ${QUANTRO_POSTGRES_PASSWORD:?Set QUANTRO_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - quantro_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantro -d quantro"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  quantro_postgres:
