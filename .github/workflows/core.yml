name: Core
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quantro_test
          POSTGRES_USER: quantro_test
          POSTGRES_PASSWORD: quantro_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantro_test -d quantro_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QUANTRO_DATABASE_URL: postgresql+psycopg://quantro_test:quantro_ci_only@localhost:5432/quantro_test
      QUANTRO_TEST_POSTGRES_URL: postgresql+psycopg://quantro_test:quantro_ci_only@localhost:5432/quantro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e '.[database,api,test]' --no-deps
      - run: python -m alembic upgrade head
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_api.py
